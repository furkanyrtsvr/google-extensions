<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Viewer Helper for GitHub</title>
    <!-- USER REQUEST: Add xlsx-js-style (Local for CSP) -->
    <script src="xlsx.custom.js"></script>
    <style>
        /* RESET & CORE LAYOUT */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            font-family: sans-serif;
            overflow: hidden;
        }

        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8b949e;
            font-size: 14px;
        }

        /* EXCEL VIEWER LAYOUT */
        #excel-wrapper {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #fff;
        }

        #excel-container {
            flex: 1;
            overflow: auto;
            background: #ffffff;
            padding: 0;
            position: relative;
        }

        /* TABLE STYLING */
        table {
            border-collapse: collapse;
            min-width: 100%;
            font-size: 13px;
            font-family: 'Segoe UI', Calibri, Helvetica, Arial, sans-serif;
            color: #000;
            background: #fff;
            table-layout: fixed;
            /* Important for col widths */
        }

        td,
        th {
            border: 1px solid #d4d4d4;
            padding: 2px 4px;
            white-space: pre-wrap;
            /* Allow wrapping if needed, consistent with Excel */
            height: 20px;
            overflow: hidden;
        }

        /* TAB BAR */
        #sheet-bar {
            height: 36px;
            flex-shrink: 0;
            background: #f3f2f1;
            border-top: 1px solid #c8c8c8;
            display: flex;
            align-items: flex-end;
            padding-left: 14px;
            box-sizing: border-box;
            gap: 4px;
            z-index: 10;
        }

        .sheet-tab {
            padding: 6px 18px;
            font-size: 13px;
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            cursor: pointer;
            color: #444;
            user-select: none;
            position: relative;
            bottom: -1px;
            border-radius: 4px 4px 0 0;
            transition: all 0.1s;
        }

        .sheet-tab:hover {
            background: #e1dfdd;
        }

        .sheet-tab.active {
            background: #fff;
            color: #107c41;
            font-weight: 600;
            border: 1px solid #c8c8c8;
            border-bottom: 2px solid #fff;
            padding-bottom: 7px;
            z-index: 5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div id="status" class="loading">Loading...</div>

    <div id="excel-wrapper">
        <div id="excel-container"></div>
        <div id="sheet-bar"></div>
    </div>

    <script src="viewer.js"></script>
</body>

</html>
